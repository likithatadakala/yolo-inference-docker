name: CI/CD Pipeline

# When does this run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test, build, and push image
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Download YOLO weights (not committed to git)
      - name: Download YOLOv8n weights
        run: |
          curl -L -o yolov8n.pt \
            https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt

      # 5. Run tests
      - name: Run pytest
        run: pytest tests/ -v

      # 6. Set up Docker Buildx (needed for build & push)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Login to Docker Hub (only on push to main, not PRs)
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Build and push (only on push to main)
      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            tadakalalikitha/yolo-inference:latest
            tadakalalikitha/yolo-inference:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max